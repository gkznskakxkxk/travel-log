<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderLog - 나만의 여행 리뷰 플랫폼</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.15); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- 1. 네비게이션 바 -->
  <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="location.reload()">
        <span class="text-2xl">✈️</span>
        <span class="text-xl font-bold bg-gradient-to-r from-teal-600 to-emerald-500 bg-clip-text text-transparent">
          WanderLog
        </span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="resetStorage()" class="text-xs text-slate-400 hover:text-slate-600 px-3 py-2 rounded-full border border-slate-200 hover:bg-slate-100 transition" title="초기 샘플 데이터로 되돌리기">
          데이터 초기화
        </button>
        <button onclick="toggleWriteModal(true)" class="bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium px-4 py-2.5 rounded-full transition shadow-sm flex items-center gap-1.5">
          <span>+ 리뷰 작성하기</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 2. 히어로 섹션 & 검색창 -->
  <section class="relative bg-slate-900 text-white py-16 sm:py-20 px-4">
    <div class="absolute inset-0 overflow-hidden opacity-40">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80" alt="배경" class="w-full h-full object-cover">
    </div>
    <div class="relative max-w-3xl mx-auto text-center space-y-6">
      <h1 class="text-3xl sm:text-5xl font-bold tracking-tight">어디로 다녀오셨나요?</h1>
      <p class="text-slate-200 text-base sm:text-lg">카드를 클릭해 생생한 전체 후기를 읽고 좋아요와 댓글을 남겨보세요.</p>
      
      <!-- 검색 바 -->
      <div class="relative max-w-xl mx-auto">
        <input 
          type="text" 
          id="searchInput" 
          oninput="filterReviews()"
          placeholder="도시, 장소명, 또는 키워드로 검색해보세요 (예: 문경, 교토, 호캉스)" 
          class="w-full pl-5 pr-12 py-4 rounded-full text-slate-800 focus:outline-none focus:ring-4 focus:ring-teal-500/50 shadow-lg text-sm sm:text-base"
        >
        <span class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">🔍</span>
      </div>
    </div>
  </section>

  <!-- 3. 메인 콘텐츠 (카테고리 필터 + 리뷰 그리드) -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
    
    <!-- 카테고리 탭 -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <div class="flex flex-wrap gap-2" id="categoryTabs">
        <button onclick="setCategory('전체')" class="cat-btn bg-teal-600 text-white px-4 py-2 rounded-full text-sm font-medium transition">전체</button>
        <button onclick="setCategory('국내여행')" class="cat-btn bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 px-4 py-2 rounded-full text-sm font-medium transition">국내여행</button>
        <button onclick="setCategory('해외여행')" class="cat-btn bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 px-4 py-2 rounded-full text-sm font-medium transition">해외여행</button>
        <button onclick="setCategory('숙소/호캉스')" class="cat-btn bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 px-4 py-2 rounded-full text-sm font-medium transition">숙소/호캉스</button>
        <button onclick="setCategory('맛집/카페')" class="cat-btn bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 px-4 py-2 rounded-full text-sm font-medium transition">맛집/카페</button>
      </div>
      <div class="text-sm text-slate-500">
        총 <span id="reviewCount" class="font-bold text-teal-600">0</span>개의 리뷰
      </div>
    </div>

    <!-- 리뷰 카드 그리드 -->
    <div id="reviewGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- 자바스크립트로 카드가 렌더링됩니다 -->
    </div>

  </main>

  <!-- 4. 리뷰 상세 보기 모달 (큰 사진 + 전체 글 + 좋아요 + 댓글) -->
  <div id="detailModal" onclick="handleBackdropClick(event, 'detailModal')" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-2xl w-full shadow-2xl overflow-hidden my-auto max-h-[90vh] flex flex-col">
      
      <!-- 상단 큰 이미지 영역 -->
      <div class="relative h-64 sm:h-80 bg-slate-900 shrink-0">
        <img id="detailImage" src="" alt="상세 사진" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/30"></div>
        
        <span id="detailCategory" class="absolute top-4 left-4 bg-teal-600 text-white text-xs font-semibold px-3 py-1.5 rounded-full shadow"></span>
        <button onclick="closeDetailModal()" class="absolute top-4 right-4 bg-black/50 hover:bg-black/80 text-white w-9 h-9 rounded-full flex items-center justify-center text-xl transition">
          &times;
        </button>

        <div class="absolute bottom-4 left-5 right-5 text-white">
          <div class="flex items-center gap-2 text-xs sm:text-sm text-teal-300 font-medium mb-1">
            <span id="detailLocation"></span>
            <span>•</span>
            <span id="detailStars"></span>
          </div>
          <h2 id="detailTitle" class="text-xl sm:text-2xl font-bold leading-snug"></h2>
        </div>
      </div>

      <!-- 본문 및 댓글 스크롤 영역 -->
      <div class="p-5 sm:p-7 overflow-y-auto space-y-6 flex-1">
        
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
          <div class="text-xs sm:text-sm text-slate-500">
            작성자: <strong id="detailAuthor" class="text-slate-800"></strong>
            <span class="mx-1.5 text-slate-300">|</span>
            <span id="detailDate"></span>
          </div>
          <div class="flex items-center gap-2">
            <button id="detailLikeBtn" onclick="toggleLike(currentDetailId, event)" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium border transition">
            </button>
            <button onclick="deleteReviewFromDetail()" class="text-xs text-slate-400 hover:text-red-500 px-2.5 py-1.5 rounded-lg hover:bg-red-50 transition">
              삭제
            </button>
          </div>
        </div>

        <div id="detailContent" class="text-slate-700 text-sm sm:text-base leading-relaxed whitespace-pre-line"></div>

        <!-- 댓글 섹션 -->
        <div class="pt-6 border-t border-slate-200 space-y-4">
          <h3 class="font-bold text-slate-800 text-sm sm:text-base flex items-center gap-1.5">
            <span>💬 댓글</span>
            <span id="detailCommentCount" class="text-teal-600">0</span>
          </h3>

          <div id="commentList" class="space-y-2.5 max-h-60 overflow-y-auto pr-1"></div>

          <form onsubmit="addComment(event)" class="flex flex-col sm:flex-row gap-2 pt-2">
            <input 
              type="text" 
              id="commentAuthor" 
              placeholder="닉네임 (선택)" 
              class="sm:w-28 border border-slate-300 rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:border-teal-500"
            >
            <div class="flex-1 flex gap-2">
              <input 
                type="text" 
                id="commentText" 
                required 
                placeholder="이 여행지에 대한 소감을 남겨보세요..." 
                class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:border-teal-500"
              >
              <button type="submit" class="bg-slate-800 hover:bg-slate-700 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg transition shrink-0">
                등록
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- 5. 리뷰 작성 모달 -->
  <div id="reviewModal" onclick="handleBackdropClick(event, 'reviewModal')" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 sm:p-8 shadow-2xl space-y-5 my-8">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="text-xl font-bold text-slate-800">새 여행 리뷰 작성</h2>
        <button onclick="toggleWriteModal(false)" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
      </div>

      <form id="reviewForm" onsubmit="addReview(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">카테고리</label>
            <select id="category" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500">
              <option value="국내여행">국내여행</option>
              <option value="해외여행">해외여행</option>
              <option value="숙소/호캉스">숙소/호캉스</option>
              <option value="맛집/카페">맛집/카페</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">별점</label>
            <select id="rating" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500">
              <option value="5">⭐⭐⭐⭐⭐ (5점)</option>
              <option value="4">⭐⭐⭐⭐ (4점)</option>
              <option value="3">⭐⭐⭐ (3점)</option>
              <option value="2">⭐⭐ (2점)</option>
              <option value="1">⭐ (1점)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">여행지 / 장소명</label>
            <input type="text" id="location" required placeholder="예: 제주 서귀포시" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">작성자 닉네임</label>
            <input type="text" id="author" placeholder="기본값: 여행자" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">리뷰 제목</label>
          <input type="text" id="title" required placeholder="한 줄 요약을 입력해주세요" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">사진 첨부 (내 기기에서 선택)</label>
          <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:border-teal-500 transition bg-slate-50/50">
            <input 
              type="file" 
              id="imageFile" 
              accept="image/*" 
              onchange="handleImagePreview(event)"
              class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer"
            >
            <p class="text-[11px] text-slate-400 mt-1.5">파일을 선택하지 않으면 기본 여행 이미지가 적용됩니다.</p>
            
            <div id="previewContainer" class="hidden mt-3 relative rounded-lg overflow-hidden border border-slate-200 h-36 bg-slate-100">
              <img id="imagePreview" src="" alt="미리보기" class="w-full h-full object-cover">
              <button type="button" onclick="clearImageSelection()" class="absolute top-2 right-2 bg-black/60 hover:bg-black/80 text-white text-xs px-2 py-1 rounded-full">
                사진 취소 ✕
              </button>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">상세 후기</label>
          <textarea id="content" rows="5" required placeholder="좋았던 점, 코스 팁, 아쉬웠던 점 등을 자유롭게 적어주세요." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="toggleWriteModal(false)" class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100">취소</button>
          <button type="submit" class="px-5 py-2 rounded-lg text-sm font-medium bg-teal-600 hover:bg-teal-700 text-white">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="bg-white border-t border-slate-200 mt-16 py-8 text-center text-xs text-slate-400">
    <p>© 2026 WanderLog Travel Review Community. All rights reserved.</p>
  </footer>

  <!-- 6. 자바스크립트 로직 -->
  <script>
    const STORAGE_KEY = 'wanderlog_reviews_v2';

    const defaultReviews = [
      {
        id: 1,
        category: '국내여행',
        location: '경북 문경새재',
        title: '맨발 걷기 좋은 황톳길과 시원한 계곡 산책 코스',
        rating: 5,
        author: '트래블러킴',
        date: '2026.10.14',
        likes: 12,
        liked: false,
        image: 'https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=1000&q=80',
        content: '단풍이 들기 시작할 때 방문했는데 공기가 정말 맑고 평탄한 길이라 산책하기 최고였습니다.\n\n제1관문부터 제2관문까지 경사가 거의 없어서 부담 없이 걸을 수 있고, 중간중간 오픈세트장 구경하는 재미도 쏠쏠합니다.\n\n내려와서 주차장 근처 식당에서 먹은 약돌돼지 석쇠구이와 오미자 막걸리 조합도 별미였으니 꼭 드셔보세요!',
        comments: [
          { id: 101, author: '산책러버', text: '이번 주말에 가보려고 했는데 좋은 정보 감사합니다!', date: '2026.10.15' },
          { id: 102, author: '맛집탐방가', text: '약돌돼지 진짜 맛있죠 ㅎㅎ 사진이 너무 예뻐요.', date: '2026.10.15' }
        ]
      },
      {
        id: 2,
        category: '숙소/호캉스',
        location: '서울 중구',
        title: '도심 속에서 즐기는 가성비 최고의 1박 2일 스테이',
        rating: 4,
        author: '호캉스러버',
        date: '2026.09.28',
        likes: 8,
        liked: false,
        image: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1000&q=80',
        content: '대중교통 접근성이 뛰어나고 침구류가 정말 폭신했습니다.\n\n체크인할 때 고층 객실로 배정받았는데 야경이 한눈에 내려다보여서 저녁 내내 창밖만 바라봤네요. 근처에 맛집도 많고 조식 뷔페의 베이커리 종류가 특히 훌륭했습니다.',
        comments: [
          { id: 103, author: '서울러', text: '혹시 주차 공간은 여유로운 편인가요?', date: '2026.09.30' }
        ]
      },
      {
        id: 3,
        category: '해외여행',
        location: '일본 교토 아라시야마',
        title: '오전 7시에 가야 진짜 매력을 느낄 수 있는 대나무숲',
        rating: 5,
        author: '교토산책자',
        date: '2026.09.15',
        likes: 19,
        liked: true,
        image: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1000&q=80',
        content: '낮에는 관광객이 너무 많다는 후기를 보고 아침 6시 반에 숙소에서 출발했어요.\n\n고요한 대나무 숲길에서 바람에 부딪히는 대나무 소리만 들으며 산책하니 마음이 정화되는 기분이었습니다. 산책 후 아라비카 커피에서 마신 라떼 한 잔까지 완벽한 오전 코스였어요.',
        comments: []
      },
      {
        id: 4,
        category: '맛집/카페',
        location: '제주 애월읍',
        title: '통창으로 오션뷰가 쏟아지는 노을 명소 카페',
        rating: 5,
        author: '카페인중독',
        date: '2026.08.22',
        likes: 15,
        liked: false,
        image: 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1000&q=80',
        content: '해 질 녘 오후 5시 반쯤 맞춰서 2층 창가 자리에 앉았는데 바다 위로 쏟아지는 윤슬이 정말 아름다웠습니다.\n\n시그니처 메뉴인 현무암 라떼와 우도 땅콩 크림빵 조합을 강력 추천합니다. 야외 테라스 포토존도 잘 되어 있어요!',
        comments: [
          { id: 104, author: '제주앓이', text: '여기 노을 시간대에 가면 진짜 최고죠!', date: '2026.08.25' }
        ]
      }
    ];

    let reviews = [];
    let currentCategory = '전체';
    let uploadedImageDataUrl = null;
    let currentDetailId = null;

    function getTodayStr() {
      const today = new Date();
      return `${today.getFullYear()}.${String(today.getMonth() + 1).padStart(2, '0')}.${String(today.getDate()).padStart(2, '0')}`;
    }

    function loadFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          reviews = JSON.parse(saved).map(r => ({
            ...r,
            likes: typeof r.likes === 'number' ? r.likes : 0,
            liked: Boolean(r.liked),
            comments: Array.isArray(r.comments) ? r.comments : []
          }));
        } else {
          reviews = JSON.parse(JSON.stringify(defaultReviews));
          saveToStorage();
        }
      } catch (err) {
        reviews = JSON.parse(JSON.stringify(defaultReviews));
      }
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
      } catch (err) {
        alert('브라우저 저장 공간(LocalStorage)이 가득 찼습니다. 오래된 리뷰를 일부 삭제해주세요.');
      }
    }

    function resetStorage() {
      if (confirm('작성하신 모든 리뷰와 댓글을 지우고 초기 샘플 상태로 되돌리시겠습니까?')) {
        localStorage.removeItem(STORAGE_KEY);
        loadFromStorage();
        filterReviews();
      }
    }

    function getStars(count) {
      return '⭐'.repeat(count) + '<span class="opacity-30">' + '⭐'.repeat(5 - count) + '</span>';
    }

    function renderReviews(data) {
      const grid = document.getElementById('reviewGrid');
      const countEl = document.getElementById('reviewCount');
      countEl.textContent = data.length;

      if (data.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-400">
            <p class="text-4xl mb-3">🗺️</p>
            <p class="text-base">조건에 맞는 여행 리뷰가 없습니다. 첫 리뷰를 남겨보세요!</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = data.map(item => `
        <article 
          onclick="openDetailModal(${item.id})" 
          class="bg-white rounded-2xl overflow-hidden border border-slate-200/80 card-hover flex flex-col group cursor-pointer"
        >
          <div class="relative h-48 bg-slate-100 overflow-hidden">
            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <span class="absolute top-3 left-3 bg-slate-900/75 backdrop-blur-sm text-white text-xs font-medium px-2.5 py-1 rounded-full">
              ${item.category}
            </span>
            <button 
              onclick="deleteReview(${item.id}, event)" 
              title="리뷰 삭제"
              class="absolute top-3 right-3 bg-white/80 hover:bg-red-500 hover:text-white text-slate-600 w-7 h-7 rounded-full flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition shadow"
            >
              🗑️
            </button>
          </div>
          <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
            <div class="space-y-2">
              <div class="flex items-center justify-between text-xs text-slate-500">
                <span class="font-medium text-teal-600">📍 ${item.location}</span>
                <span>${getStars(item.rating)}</span>
              </div>
              <h3 class="font-bold text-lg text-slate-800 leading-snug line-clamp-1 group-hover:text-teal-600 transition">${item.title}</h3>
              <p class="text-slate-600 text-sm leading-relaxed line-clamp-2">${item.content}</p>
            </div>
            
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
              <span><strong class="text-slate-600 font-medium">${item.author}</strong> · ${item.date}</span>
              <div class="flex items-center gap-3">
                <button 
                  onclick="toggleLike(${item.id}, event)" 
                  class="flex items-center gap-1 font-medium transition ${item.liked ? 'text-rose-500' : 'text-slate-400 hover:text-rose-500'}"
                >
                  <span>${item.liked ? '❤️' : '🤍'}</span>
                  <span>${item.likes}</span>
                </button>
                <span class="flex items-center gap-1 text-slate-400">
                  <span>💬</span>
                  <span>${item.comments ? item.comments.length : 0}</span>
                </span>
              </div>
            </div>
          </div>
        </article>
      `).join('');
    }

    function openDetailModal(id) {
      const review = reviews.find(r => r.id === id);
      if (!review) return;

      currentDetailId = id;
      document.getElementById('detailImage').src = review.image;
      document.getElementById('detailCategory').textContent = review.category;
      document.getElementById('detailLocation').textContent = `📍 ${review.location}`;
      document.getElementById('detailStars').innerHTML = getStars(review.rating);
      document.getElementById('detailTitle').textContent = review.title;
      document.getElementById('detailAuthor').textContent = review.author;
      document.getElementById('detailDate').textContent = review.date;
      document.getElementById('detailContent').textContent = review.content;

      updateDetailLikeButton(review);
      renderComments(review);

      document.getElementById('detailModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeDetailModal() {
      currentDetailId = null;
      document.getElementById('detailModal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    function updateDetailLikeButton(review) {
      const btn = document.getElementById('detailLikeBtn');
      if (review.liked) {
        btn.className = 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium border border-rose-200 bg-rose-50 text-rose-600 transition';
        btn.innerHTML = `<span>❤️ 좋아요</span> <strong>${review.likes}</strong>`;
      } else {
        btn.className = 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition';
        btn.innerHTML = `<span>🤍 좋아요</span> <strong>${review.likes}</strong>`;
      }
    }

    function toggleLike(id, event) {
      if (event) event.stopPropagation();
      const review = reviews.find(r => r.id === id);
      if (!review) return;

      review.liked = !review.liked;
      review.likes += review.liked ? 1 : -1;

      saveToStorage();
      filterReviews();

      if (currentDetailId === id) {
        updateDetailLikeButton(review);
      }
    }

    function renderComments(review) {
      const listEl = document.getElementById('commentList');
      const countEl = document.getElementById('detailCommentCount');
      const comments = review.comments || [];
      countEl.textContent = comments.length;

      if (comments.length === 0) {
        listEl.innerHTML = `
          <p class="text-xs text-slate-400 py-4 text-center bg-slate-50 rounded-xl">
            아직 작성된 댓글이 없습니다. 첫 댓글을 남겨보세요!
          </p>
        `;
        return;
      }

      listEl.innerHTML = comments.map(c => `
        <div class="bg-slate-50 rounded-xl px-4 py-3 text-xs sm:text-sm flex justify-between items-start gap-2 border border-slate-100">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <strong class="font-semibold text-slate-700">${c.author}</strong>
              <span class="text-[11px] text-slate-400">${c.date}</span>
            </div>
            <p class="text-slate-600 leading-snug break-all">${c.text}</p>
          </div>
          <button 
            onclick="deleteComment(${c.id})" 
            class="text-slate-300 hover:text-red-500 text-sm px-1 transition shrink-0"
            title="댓글 삭제"
          >
            &times;
          </button>
        </div>
      `).join('');
    }

    function addComment(e) {
      e.preventDefault();
      if (!currentDetailId) return;

      const review = reviews.find(r => r.id === currentDetailId);
      if (!review) return;

      const authorInput = document.getElementById('commentAuthor');
      const textInput = document.getElementById('commentText');

      const newComment = {
        id: Date.now(),
        author: authorInput.value.trim() || '익명 여행자',
        text: textInput.value.trim(),
        date: getTodayStr()
      };

      if (!review.comments) review.comments = [];
      review.comments.push(newComment);

      textInput.value = '';
      saveToStorage();
      renderComments(review);
      filterReviews();
    }

    function deleteComment(commentId) {
      const review = reviews.find(r => r.id === currentDetailId);
      if (!review) return;

      review.comments = review.comments.filter(c => c.id !== commentId);
      saveToStorage();
      renderComments(review);
      filterReviews();
    }

    function deleteReview(id, event) {
      if (event) event.stopPropagation();
      if (confirm('이 리뷰를 삭제하시겠습니까?')) {
        reviews = reviews.filter(r => r.id !== id);
        saveToStorage();
        filterReviews();
      }
    }

    function deleteReviewFromDetail() {
      if (!currentDetailId) return;
      if (confirm('이 리뷰를 삭제하시겠습니까?')) {
        reviews = reviews.filter(r => r.id !== currentDetailId);
        saveToStorage();
        closeDetailModal();
        filterReviews();
      }
    }

    function handleBackdropClick(event, modalId) {
      if (event.target.id === modalId) {
        if (modalId === 'detailModal') closeDetailModal();
        if (modalId === 'reviewModal') toggleWriteModal(false);
      }
    }

    function handleImagePreview(event) {
      const file = event.target.files[0];
      if (!file) {
        clearImageSelection();
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 900;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          uploadedImageDataUrl = canvas.toDataURL('image/jpeg', 0.82);

          document.getElementById('imagePreview').src = uploadedImageDataUrl;
          document.getElementById('previewContainer').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearImageSelection() {
      uploadedImageDataUrl = null;
      document.getElementById('imageFile').value = '';
      document.getElementById('imagePreview').src = '';
      document.getElementById('previewContainer').classList.add('hidden');
    }

    function setCategory(cat) {
      currentCategory = cat;
      const buttons = document.querySelectorAll('.cat-btn');
      buttons.forEach(btn => {
        if (btn.textContent === cat) {
          btn.className = 'cat-btn bg-teal-600 text-white px-4 py-2 rounded-full text-sm font-medium transition';
        } else {
          btn.className = 'cat-btn bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 px-4 py-2 rounded-full text-sm font-medium transition';
        }
      });
      filterReviews();
    }

    function filterReviews() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = reviews.filter(r => {
        const matchCategory = currentCategory === '전체' || r.category === currentCategory;
        const matchKeyword = r.title.toLowerCase().includes(keyword) || 
                             r.location.toLowerCase().includes(keyword) || 
                             r.content.toLowerCase().includes(keyword);
        return matchCategory && matchKeyword;
      });
      renderReviews(filtered);
    }

    function toggleWriteModal(show) {
      const modal = document.getElementById('reviewModal');
      if (show) {
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      } else {
        modal.classList.add('hidden');
        document.getElementById('reviewForm').reset();
        clearImageSelection();
        document.body.style.overflow = '';
      }
    }

    function addReview(e) {
      e.preventDefault();
      const category = document.getElementById('category').value;
      const rating = parseInt(document.getElementById('rating').value, 10);
      const location = document.getElementById('location').value.trim();
      const author = document.getElementById('author').value.trim() || '여행자';
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();

      const newReview = {
        id: Date.now(),
        category,
        location,
        title,
        rating,
        author,
        date: getTodayStr(),
        likes: 0,
        liked: false,
        image: uploadedImageDataUrl || 'https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=1000&q=80',
        content,
        comments: []
      };

      reviews.unshift(newReview);
      saveToStorage();
      toggleWriteModal(false);
      filterReviews();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeDetailModal();
        toggleWriteModal(false);
      }
    });

    loadFromStorage();
    renderReviews(reviews);
  </script>
</body>
</html>
